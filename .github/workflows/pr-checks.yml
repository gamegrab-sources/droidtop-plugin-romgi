name: PR checks

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (db/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: db/requirements.txt

      - name: Install runtime + test deps
        run: pip install -r db/requirements.txt pytest

      - name: Build MiNERVA test fixture
        working-directory: db
        run: python tests/fixtures/build_minerva_fixture.py

      - name: Run pytest
        working-directory: db
        run: python -m pytest tests -v

  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

  flutter-test:
    name: Flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

  android-build:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # This job builds BOTH debug and release APKs from a cold Gradle/
      # Flutter cache on any repo that hasn't warmed one up yet (a fresh
      # fork's own runner cache is separate from the origin repo's) --
      # confirmed the hard way: it failed with "No space left on device"
      # on every single run of a mirror of this repo, while the same
      # commit built fine here, where months of runs keep the Gradle
      # cache warm. A cold run downloads and unpacks the full Gradle
      # dependency graph and Android SDK components on top of whatever
      # the runner image ships with -- removing large preinstalled
      # toolchains this build never touches (dotnet, GHC/Haskell,
      # CodeQL, and cached Docker images) buys back real room without
      # touching anything Android/NDK-related the pkg2zip native build
      # actually needs.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Branch name for artifact naming and (via GITHUB_HEAD_REF/GITHUB_REF_NAME,
      # read directly by android/app/build.gradle.kts) the app's package id/label.
      - name: Compute branch slug
        id: meta
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          echo "safe_branch=${branch//\//-}" >> "$GITHUB_OUTPUT"
          echo "app_version=$(sed -n 's/^version: *//p' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      # Bumps android/app/revision.txt (read by build.gradle.kts to stamp
      # "-rN" onto versionName) and commits it back so it persists across
      # runs. [skip ci] keeps this commit from re-triggering the workflow.
      # Only runs on pushes to feature branches — main doesn't use this,
      # and pull_request builds shouldn't mutate branch state. Only in this
      # repository: copies of these branches elsewhere (the droidtop plugin
      # repo's upstream-* mirrors) must stay equal to the branch they copy,
      # and a bump commit there makes their fast-forward sync fail.
      - name: Bump build revision
        if: >-
          github.event_name == 'push' && github.ref_name != 'main' &&
          github.repository == 'bi0shacker001/romgi'
        run: |
          cd android/app
          rev=$(( $(cat revision.txt 2>/dev/null || echo 0) + 1 ))
          echo "$rev" > revision.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add revision.txt
          git commit -m "Bump build revision to r$rev [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Build debug APK
        run: >
          flutter build apk --debug
          --dart-define=SCREENSCRAPER_DEV_ID=${{ secrets.SCREENSCRAPER_DEV_ID }}
          --dart-define=SCREENSCRAPER_DEV_PASSWORD=${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
          --dart-define=ROMGI_RELEASE_TAG=build-${{ steps.meta.outputs.safe_branch }}
          --dart-define=ROMGI_BUILD_NUMBER=${{ github.run_number }}

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=SCREENSCRAPER_DEV_ID=${{ secrets.SCREENSCRAPER_DEV_ID }}
          --dart-define=SCREENSCRAPER_DEV_PASSWORD=${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
          --dart-define=ROMGI_RELEASE_TAG=build-${{ steps.meta.outputs.safe_branch }}
          --dart-define=ROMGI_BUILD_NUMBER=${{ github.run_number }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: romgi-${{ steps.meta.outputs.safe_branch }}-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: romgi-${{ steps.meta.outputs.safe_branch }}-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # One rolling pre-release per branch (tag build-<branch>), so there's
      # a stable, easy-to-find download link instead of digging through
      # Actions run history — each push replaces this branch's release
      # in place rather than accumulating new ones. Skipped on pull_request
      # runs (e.g. from forks) since those shouldn't publish anything, and on
      # ci/* scratch branches, which only exist to run these checks.
      - name: Rename APKs for release
        if: github.event_name == 'push' && !startsWith(github.ref_name, 'ci/')
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk "romgi-${{ steps.meta.outputs.safe_branch }}-debug.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "romgi-${{ steps.meta.outputs.safe_branch }}-release.apk"

      - name: Publish branch release
        if: github.event_name == 'push' && !startsWith(github.ref_name, 'ci/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.meta.outputs.safe_branch }}
          name: romgi (${{ steps.meta.outputs.safe_branch }}) — latest build
          prerelease: false
          # Only main's build is the repository's "Latest" release; a branch
          # build stays non-prerelease (for Obtainium) without taking it over.
          make_latest: ${{ github.ref_name == 'main' && 'true' || 'false' }}
          body: |
            Automated build from ${{ github.sha }}. Replaced on every push to
            `${{ steps.meta.outputs.safe_branch }}` — not a stable release,
            but marked non-prerelease so update-tracking tools (e.g.
            Obtainium) pick it up without manual approval.

            The in-app updater reads the two lines below (UpdateChannel in
            lib/services/update_service.dart); keep their format.

            romgi-build: ${{ github.run_number }}
            romgi-version: ${{ steps.meta.outputs.app_version }}
          files: |
            romgi-${{ steps.meta.outputs.safe_branch }}-debug.apk
            romgi-${{ steps.meta.outputs.safe_branch }}-release.apk
