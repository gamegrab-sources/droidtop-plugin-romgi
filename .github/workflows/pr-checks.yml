name: PR checks

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (db/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: db/requirements.txt

      - name: Install runtime + test deps
        run: pip install -r db/requirements.txt pytest

      - name: Build MiNERVA test fixture
        working-directory: db
        run: python tests/fixtures/build_minerva_fixture.py

      - name: Run pytest
        working-directory: db
        run: python -m pytest tests -v

  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

  flutter-test:
    name: Flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

  droidtop-plugin-bundle:
    # Builds this branch's droidtop flutter_embed plugin bundle
    # (droidtop_plugin/, unmodified upstream repo otherwise -- see
    # droidtop_plugin/README.md). This is the ONLY thing plugin-core and
    # every plugin/<line> branch ship: no APK build, no APK release --
    # those belong to main/upstream-<line>, which don't carry this job
    # at all (droidtop_plugin/build.sh only exists here).
    #
    # This plugin is private and not part of the official droidtop trust
    # ring: it signs with its own independent P-256 key ("bi0shacker001"
    # origin), held only as this repo's PRIVATE_PLUGIN_SIGNING_KEY
    # secret -- never derived from and never mixed with droidtop's own
    # master/root key. CI signs the bundle itself and publishes only the
    # signed .droidplugin.tar.xz; there is no unsigned release asset.
    name: droidtop plugin bundle (signed)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check this branch carries the plugin-core wrapper
        id: has_wrapper
        run: |
          if [ -f droidtop_plugin/build.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
          # Artifact/tag names can't contain "/", and branch names here
          # always do (plugin/<line>).
          echo "safe_branch=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Flutter SDK
        if: steps.has_wrapper.outputs.present == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/flutter.tar.xz" https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.5-stable.tar.xz
          echo "2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb  $RUNNER_TEMP/flutter.tar.xz" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/flutter.tar.xz"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Build the plugin bundle (unsigned payload + manifest)
        if: steps.has_wrapper.outputs.present == 'true'
        env:
          DROIDTOP_PLUGIN_BUILD: ${{ github.run_number }}
        run: |
          flutter config --no-analytics >/dev/null
          ./droidtop_plugin/build.sh

      - name: Sign the plugin bundle
        if: steps.has_wrapper.outputs.present == 'true' && github.event_name == 'push'
        env:
          KEY_PEM: ${{ secrets.PRIVATE_PLUGIN_SIGNING_KEY }}
        run: |
          KEYFILE="$RUNNER_TEMP/private-plugin-signing-key.pem"
          printf '%s' "$KEY_PEM" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          PRIVATE_PLUGIN_SIGNING_KEY="$KEYFILE" ./droidtop_plugin/sign.sh
          rm -f "$KEYFILE"

      # One rolling release per branch (tag build-<branch>), same scheme
      # main/upstream-<line> use for their APK builds -- replaces the
      # release in place (delete + recreate, so a stale APK asset from
      # before this job existed never lingers) rather than accumulating.
      # Skipped on pull_request runs: those shouldn't publish anything or
      # need the signing key.
      - name: Publish the signed bundle release
        if: steps.has_wrapper.outputs.present == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLUGIN_ID="$(python3 -c "import json; print(json.load(open('droidtop_plugin/build/manifest.json'))['id'])")"
          BUNDLE="${PLUGIN_ID}.droidplugin.tar.xz"
          test -f "$BUNDLE" || { echo "missing $BUNDLE -- sign step didn't run or failed" >&2; exit 1; }
          tag="build-${{ steps.has_wrapper.outputs.safe_branch }}"
          gh release delete "$tag" --yes --cleanup-tag --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create "$tag" "$BUNDLE" droidtop-plugin-key.json \
            --repo "${{ github.repository }}" \
            --title "romgi (${{ github.ref_name }}) — latest plugin bundle" \
            --notes "Automated build from ${{ github.sha }}. Signed droidtop plugin bundle, private (independent \`bi0shacker001\` origin key -- see droidtop_plugin/README.md, not the official droidtop trust ring). Replaced on every push to \`${{ github.ref_name }}\`."
