name: Upstream sync

# Keeps this fork current with caprado/romgi and keeps every feature branch
# current with our own main, without ever force-resolving a real conflict:
# a conflict opens an issue and leaves that branch untouched.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  sync-main:
    name: Merge upstream into main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "bi0shacker001"
          git config user.email "bioshacker001@gmail.com"

      - name: Merge caprado/romgi main
        id: merge
        run: |
          git remote add upstream https://github.com/caprado/romgi.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "already up to date with upstream"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-edit -m "Merge upstream caprado/romgi main" upstream/main; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push main
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      - name: Open conflict issue
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > /tmp/issue-body.md <<BODY
          The scheduled upstream-sync workflow could not merge caprado/romgi's
          main into our main -- a real conflict, left untouched rather than
          force-resolved. Run: $RUN_URL

          Resolve by hand:
          \`\`\`
          git fetch upstream main
          git checkout main
          git merge upstream/main
          # resolve, then
          git push origin HEAD:main
          \`\`\`
          BODY
          title="Upstream sync conflict: main vs caprado/romgi main"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json title -q ".[] | select(.title == \"$title\") | .title")
          if [ -n "$existing" ]; then
            echo "issue already open, not filing a duplicate"
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$title" \
              --body-file /tmp/issue-body.md
          fi

  sync-branches:
    name: Sync feature branches with main
    needs: sync-main
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - 3ds-decrypt
          - controller-support
          - macintosh-garden
          - prowlarr-integration
          - ps3-license
          - self-hosted-db
          - vita-license
          - ci/update-actions
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ matrix.branch }}

      - name: Configure git identity
        run: |
          git config user.name "bi0shacker001"
          git config user.email "bioshacker001@gmail.com"

      - name: Merge main into this branch
        id: merge
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "already up to date with main"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-edit -m "Merge branch 'main' into ${{ matrix.branch }}" origin/main; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:${{ matrix.branch }}

      - name: Open conflict issue
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ matrix.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > /tmp/issue-body.md <<BODY
          The scheduled upstream-sync workflow could not merge main into
          $BRANCH -- a real conflict, left untouched rather than
          force-resolved. Run: $RUN_URL

          Resolve by hand:
          \`\`\`
          git checkout $BRANCH
          git merge main
          # resolve, then
          git push origin HEAD:$BRANCH
          \`\`\`
          BODY
          title="Upstream sync conflict: $BRANCH vs main"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json title -q ".[] | select(.title == \"$title\") | .title")
          if [ -n "$existing" ]; then
            echo "issue already open, not filing a duplicate"
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$title" \
              --body-file /tmp/issue-body.md
          fi
